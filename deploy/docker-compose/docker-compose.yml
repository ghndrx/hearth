version: '3.8'

# Hearth - Full Stack Docker Compose
# Copy .env.example to .env and configure before running

services:
  hearth:
    image: ghcr.io/ghndrx/hearth:latest
    container_name: hearth
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${TURN_PORT:-3478}:3478/udp"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/hearth.db}
      - REDIS_URL=${REDIS_URL:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_PATH=/data/uploads
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - INVITE_ONLY=${INVITE_ONLY:-false}
    volumes:
      - hearth-data:/data
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL (optional - remove if using SQLite)
  db:
    image: postgres:16-alpine
    container_name: hearth-db
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=${DB_USER:-hearth}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-hearth}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hearth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (optional - for caching and multi-instance)
  redis:
    image: redis:7-alpine
    container_name: hearth-redis
    profiles:
      - redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # MinIO (optional - S3-compatible storage)
  minio:
    image: minio/minio
    container_name: hearth-minio
    profiles:
      - s3
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # FusionAuth (optional - SSO/OIDC auth provider)
  # For full FusionAuth stack with its own DB, use deploy/fusionauth/ instead
  fusionauth:
    image: fusionauth/fusionauth-app:latest
    container_name: hearth-fusionauth
    profiles:
      - fusionauth
    ports:
      - "${FUSIONAUTH_PORT:-9011}:9011"
    environment:
      DATABASE_URL: jdbc:postgresql://fusionauth-db:5432/${FUSIONAUTH_DB_NAME:-fusionauth}
      DATABASE_ROOT_USERNAME: ${FUSIONAUTH_DB_USER:-fusionauth}
      DATABASE_ROOT_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      DATABASE_USERNAME: ${FUSIONAUTH_DB_USER:-fusionauth}
      DATABASE_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      FUSIONAUTH_APP_MEMORY: ${FUSIONAUTH_APP_MEMORY:-512M}
      FUSIONAUTH_APP_RUNTIME_MODE: ${FUSIONAUTH_RUNTIME_MODE:-development}
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SEARCH_TYPE: database
    volumes:
      - fusionauth-config:/usr/local/fusionauth/config
    depends_on:
      fusionauth-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9011/api/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  fusionauth-db:
    image: postgres:16-alpine
    container_name: hearth-fusionauth-db
    profiles:
      - fusionauth
    environment:
      POSTGRES_USER: ${FUSIONAUTH_DB_USER:-fusionauth}
      POSTGRES_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      POSTGRES_DB: ${FUSIONAUTH_DB_NAME:-fusionauth}
    volumes:
      - fusionauth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FUSIONAUTH_DB_USER:-fusionauth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Caddy reverse proxy (optional - auto SSL)
  caddy:
    image: caddy:2-alpine
    container_name: hearth-caddy
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  hearth-data:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  fusionauth-config:
  fusionauth-db-data:
