# Authentik Standalone Proxy Outpost
# ===================================
# This deploys a standalone proxy outpost to handle forward_auth for:
#   - uptime.plexical.com (Uptime Kuma)
#   - sonarr.plexical.com (Sonarr)
#   - radarr.plexical.com (Radarr)
#   - prowlarr.plexical.com (Prowlarr)
#
# Prerequisites:
# 1. Create an Outpost in Authentik Admin UI:
#    - Go to Applications > Outposts > Create
#    - Name: "proxy-outpost" (or similar)
#    - Type: Proxy
#    - Integration: Leave empty for manual/docker deployment
#    - Select the applications/providers you want this outpost to serve
#
# 2. Get the Outpost Token:
#    - After creating, click the outpost
#    - Copy the "Outpost Token" value
#    - Create .env file with: AUTHENTIK_TOKEN=<your-token>
#
# 3. Ensure the applications have Proxy Providers configured in Authentik:
#    - Mode: Forward auth (single application) or Forward auth (domain level)
#    - External Host: https://app.plexical.com
#
# ===================================

services:
  authentik-proxy:
    image: ghcr.io/goauthentik/proxy:latest
    container_name: authentik-proxy-outpost
    restart: unless-stopped
    ports:
      - "9000:9000"      # HTTP proxy port
      - "9443:9443"      # HTTPS proxy port (optional)
    environment:
      # Authentik server URL (internal or external, must be reachable)
      AUTHENTIK_HOST: https://authentik.home.plexical.com
      # Outpost token from Authentik admin UI
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN}
      # Disable TLS verification if using self-signed certs (optional)
      # AUTHENTIK_INSECURE: "true"
      # Log level (debug, info, warning, error)
      AUTHENTIK_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9000/outpost.goauthentik.io/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - proxy
    labels:
      # Optional: Traefik labels if exposing the outpost itself
      - "traefik.enable=false"

networks:
  proxy:
    external: true
    name: proxy  # Adjust to match your Traefik/Caddy network name

# ===================================
# CADDY FORWARD AUTH CONFIGURATION
# ===================================
# Add to your Caddyfile for each protected application:
#
# uptime.plexical.com {
#     forward_auth authentik-proxy-outpost:9000 {
#         uri /outpost.goauthentik.io/auth/caddy
#         copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt X-Authentik-Meta-Jwks X-Authentik-Meta-Outpost X-Authentik-Meta-Provider X-Authentik-Meta-App X-Authentik-Meta-Version
#         trusted_proxies private_ranges
#     }
#     reverse_proxy uptime-kuma:3001
# }
#
# sonarr.plexical.com {
#     forward_auth authentik-proxy-outpost:9000 {
#         uri /outpost.goauthentik.io/auth/caddy
#         copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt X-Authentik-Meta-Jwks X-Authentik-Meta-Outpost X-Authentik-Meta-Provider X-Authentik-Meta-App X-Authentik-Meta-Version
#         trusted_proxies private_ranges
#     }
#     reverse_proxy sonarr:8989
# }
#
# radarr.plexical.com {
#     forward_auth authentik-proxy-outpost:9000 {
#         uri /outpost.goauthentik.io/auth/caddy
#         copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt X-Authentik-Meta-Jwks X-Authentik-Meta-Outpost X-Authentik-Meta-Provider X-Authentik-Meta-App X-Authentik-Meta-Version
#         trusted_proxies private_ranges
#     }
#     reverse_proxy radarr:7878
# }
#
# prowlarr.plexical.com {
#     forward_auth authentik-proxy-outpost:9000 {
#         uri /outpost.goauthentik.io/auth/caddy
#         copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt X-Authentik-Meta-Jwks X-Authentik-Meta-Outpost X-Authentik-Meta-Provider X-Authentik-Meta-App X-Authentik-Meta-Version
#         trusted_proxies private_ranges
#     }
#     reverse_proxy prowlarr:9696
# }
#
# ===================================
# TRAEFIK FORWARD AUTH CONFIGURATION
# ===================================
# If using Traefik instead, add this middleware:
#
# http:
#   middlewares:
#     authentik:
#       forwardAuth:
#         address: http://authentik-proxy-outpost:9000/outpost.goauthentik.io/auth/traefik
#         trustForwardHeader: true
#         authResponseHeaders:
#           - X-authentik-username
#           - X-authentik-groups
#           - X-authentik-email
#           - X-authentik-name
#           - X-authentik-uid
#           - X-authentik-jwt
#           - X-authentik-meta-jwks
#           - X-authentik-meta-outpost
#           - X-authentik-meta-provider
#           - X-authentik-meta-app
#           - X-authentik-meta-version
#
# Then apply the middleware to your routers:
#   labels:
#     - "traefik.http.routers.uptime.middlewares=authentik@file"
#
# ===================================
# DEPLOYMENT
# ===================================
# 1. Create .env file:
#    echo "AUTHENTIK_TOKEN=your-outpost-token-here" > .env
#
# 2. Deploy:
#    docker compose up -d
#
# 3. Check logs:
#    docker compose logs -f
#
# 4. Verify health:
#    curl http://localhost:9000/outpost.goauthentik.io/ping
