apiVersion: v2
name: hearth
description: A self-hosted Discord alternative with end-to-end encryption
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - discord
  - chat
  - voip
  - e2ee
  - self-hosted
maintainers:
  - name: Greg Hendrickson
    email: greg@hearth.dev
home: https://hearth.dev
sources:
  - https://github.com/ghndrx/hearth

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com"
    condition: redis.enabled
  - name: minio
    version: "12.x.x"
    repository: "https://charts.bitnami.com"
    condition: minio.enabled
  - name: fusionauth
    version: "1.x.x"
    repository: "file://../fusionauth"
    condition: fusionauth.enabled
