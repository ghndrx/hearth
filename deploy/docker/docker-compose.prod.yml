# Hearth Production Docker Compose
# Production-ready with SSL, Nginx reverse proxy, monitoring

version: '3.8'

services:
  # ============ CORE SERVICES ============
  
  hearth-backend:
    image: ghndrx/hearth-backend:${VERSION:-latest}
    container_name: hearth-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - ./env/backend.env
    environment:
      - DATABASE_URL=postgres://hearth:${DB_PASSWORD}@postgres:5432/hearth?sslmode=require
      - REDIS_URL=rediss://:${REDIS_PASSWORD}@redis:6379/0
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hearth-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hearth-frontend:
    image: ghndrx/hearth-frontend:${VERSION:-latest}
    container_name: hearth-frontend
    restart: always
    expose:
      - "3000"
    environment:
      - API_URL=${API_URL}
      - WS_URL=${WS_URL}
    networks:
      - hearth-network

  # ============ REVERSE PROXY ============
  
  nginx:
    image: nginx:alpine
    container_name: hearth-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - hearth-backend
      - hearth-frontend
    networks:
      - hearth-network

  # ============ DATA STORES ============
  
  postgres:
    image: postgres:16-alpine
    container_name: hearth-postgres
    restart: always
    environment:
      - POSTGRES_USER=hearth
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hearth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    expose:
      - "5432"
    networks:
      - hearth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1

  redis:
    image: redis:7-alpine
    container_name: hearth-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - hearth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ MONITORING ============
  
  prometheus:
    image: prom/prometheus:latest
    container_name: hearth-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - hearth-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    container_name: hearth-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hearth-network
    depends_on:
      - prometheus

  # ============ BACKUP ============
  
  backup:
    image: postgres:16-alpine
    container_name: hearth-backup
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - hearth-network
    command: >
      /bin/sh -c
      "while true; do
        sleep 21600;
        pg_dump -Fc -U hearth hearth > /backups/hearth_$(date +%Y%m%d_%H%M%S).dump;
        find /backups -name 'hearth_*.dump' -mtime +7 -delete;
      done"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  hearth-network:
    driver: bridge
