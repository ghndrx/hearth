name: Droid Security Scan

on:
  schedule:
    # Run weekly on Sunday at 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - packages
          - vulnerabilities

# Cancel old runs when new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Package Bump Detection (Dependabot-style) ───
  package-bumps:
    name: Package Bump Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.scan_type == 'all' || inputs.scan_type == 'packages') || github.event_name == 'schedule'
    outputs:
      has_go_updates: ${{ steps.go-outdated.outputs.has_updates }}
      has_npm_updates: ${{ steps.npm-outdated.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v4

      # ─── Go Package Updates ───
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: backend/go.sum

      - name: Check Go module updates
        id: go-outdated
        working-directory: ./backend
        run: |
          # Get list of updatable modules
          OUTDATED=$(go list -u -m all 2>/dev/null | grep -v '^$' | tail -n +2)
          if [ -n "$OUTDATED" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "## Go Module Updates Available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTDATED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "## Go Modules" >> $GITHUB_STEP_SUMMARY
            echo "✅ All Go dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi

      # ─── Node.js Package Updates ───
      - name: Setup Bun
        if: hashFiles('frontend/package.json')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check npm outdated
        id: npm-outdated
        if: hashFiles('frontend/package.json')
        working-directory: ./frontend
        run: |
          bunx npm-outdated --json > npm-outdated.json 2>/dev/null || true
          if [ -s npm-outdated.json ] && [ "$(cat npm-outdated.json | jq 'length')" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "## npm Package Updates Available" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat npm-outdated.json | jq -r 'to_entries[] | "\(.key): \(.value.current) → \(.value.latest)"' >> $GITHUB_STEP_SUMMARY || cat npm-outdated.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "## npm Packages" >> $GITHUB_STEP_SUMMARY
            echo "✅ All npm dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi

      # ─── Create GitHub Issues for Outdated Packages ───
      - name: Create issue for Go updates
        if: steps.go-outdated.outputs.has_updates == 'true'
        run: |
          ISSUE_BODY=$(cat << 'EOF'
          ## Go Dependency Updates Available

          The following Go modules have newer versions available:

          ```
          ${{ steps.go-outdated.outputs.go_outdated }}
          ```

          Consider running:
          ```bash
          cd backend && go get -u ./...
          go mod tidy
          ```

          *Auto-generated by Droid Security Scan*
          EOF
          )
          gh issue create \
            --title "🔄 Go Dependency Updates Available" \
            --body "$ISSUE_BODY" \
            --label "dependencies,security"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create issue for npm updates
        if: steps.npm-outdated.outputs.has_updates == 'true'
        run: |
          ISSUE_BODY=$(cat << 'EOF'
          ## npm Dependency Updates Available

          The following npm packages have newer versions available. Run:

          ```bash
          cd frontend && bun update
          ```

          *Auto-generated by Droid Security Scan*
          EOF
          )
          gh issue create \
            --title "🔄 npm Dependency Updates Available" \
            --body "$ISSUE_BODY" \
            --label "dependencies,security"
        env:
          GH_TOKEN: ${{ github.token }}

  # ─── Trivy CVE Vulnerability Scanner ───
  trivy-scan:
    name: Trivy CVE Scanner
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.scan_type == 'all' || inputs.scan_type == 'vulnerabilities') || github.event_name == 'schedule'
    outputs:
      critical_count: ${{ steps.trivy.outputs.critical_count }}
      high_count: ${{ steps.trivy.outputs.high_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: 'trivy-filesystem'

      - name: Parse vulnerability counts
        id: parse-results
        run: |
          # Extract vulnerability counts from Trivy output
          CRITICAL=$(grep -c '"Severity":"CRITICAL"' trivy-results.sarif 2>/dev/null || echo "0")
          HIGH=$(grep -c '"Severity":"HIGH"' trivy-results.sarif 2>/dev/null || echo "0")
          MEDIUM=$(grep -c '"Severity":"MEDIUM"' trivy-results.sarif 2>/dev/null || echo "0")
          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH" >> $GITHUB_OUTPUT
          echo "medium_count=$MEDIUM" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Trivy CVE Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${{ steps.parse-results.outputs.critical_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${{ steps.parse-results.outputs.high_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | ${{ steps.parse-results.outputs.medium_count }} |" >> $GITHUB_STEP_SUMMARY

      - name: Create issue for critical vulnerabilities
        if: steps.parse-results.outputs.critical_count > 0
        run: |
          ISSUE_BODY=$(cat << EOF
          ## Critical CVE Vulnerabilities Detected

          Trivy found **${{ steps.parse-results.outputs.critical_count }}** critical and **${{ steps.parse-results.outputs.high_count }}** high severity vulnerabilities.

          Please review the [GitHub Security tab](${{ github.server_url }}/${{ github.repository }}/security) for details.

          *Auto-generated by Droid Security Scan*
          EOF
          )
          gh issue create \
            --title "🚨 Critical CVE Vulnerabilities Detected" \
            --body "$ISSUE_BODY" \
            --label "security,CVE"
        env:
          GH_TOKEN: ${{ github.token }}

  # ─── Docker Image CVE Scan (if Dockerfile exists) ───
  trivy-docker:
    name: Trivy Docker Scan
    runs-on: ubuntu-latest
    if: hashFiles('Dockerfile') && (github.event_name == 'workflow_dispatch' && (inputs.scan_type == 'all' || inputs.scan_type == 'vulnerabilities') || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hearth-app:${{ github.sha }} .

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hearth-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-docker.sarif'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-docker.sarif
          category: 'trivy-docker'

  # ─── Summary Dashboard ───
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [package-bumps, trivy-scan, trivy-docker]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🛡️ Droid Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Package updates
          if [ "${{ needs.package-bumps.outputs.has_go_updates }}" == "true" ]; then
            echo "📦 **Go packages**: Updates available - [Create PR](${{ github.server_url }}/${{ github.repository }}/labels/dependencies)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Go packages**: All up to date" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.package-bumps.outputs.has_npm_updates }}" == "true" ]; then
            echo "📦 **npm packages**: Updates available" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **npm packages**: All up to date" >> $GITHUB_STEP_SUMMARY
          fi

          # Vulnerabilities
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **CVE Scan**: ${{ needs.trivy-scan.outputs.critical_count }} critical, ${{ needs.trivy-scan.outputs.high_count }} high" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Scan completed at ${{ github.run_id }}_" >> $GITHUB_STEP_SUMMARY
