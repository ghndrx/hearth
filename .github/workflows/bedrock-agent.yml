name: AI Agent - AWS Bedrock
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: true
        default: 'review code and suggest improvements'
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

env:
  AWS_REGION: us-west-2

jobs:
  agent-run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install boto3
          
      - name: Run Kimi Agent
        id: agent
        env:
          TASK: ${{ github.event.inputs.task || 'review recent commits and suggest improvements' }}
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: |
          python3 << 'EOF'
          import boto3
          import json
          import os
          import subprocess
          
          bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')
          
          # Gather context
          task = os.environ.get('TASK', 'review code')
          repo = os.environ.get('GITHUB_REPOSITORY', 'unknown')
          ref = os.environ.get('GITHUB_REF', 'unknown')
          
          # Get recent git log
          try:
              git_log = subprocess.check_output(['git', 'log', '--oneline', '-10'], text=True)
          except:
              git_log = 'Unable to fetch git log'
          
          # Get changed files if PR
          try:
              diff_stat = subprocess.check_output(['git', 'diff', '--stat', 'HEAD~1'], text=True)
          except:
              diff_stat = 'Unable to fetch diff'
          
          # Build prompt
          prompt = f"""Task: {task}

          Repository: {repo}
          Branch/Ref: {ref}

          Recent commits:
          {git_log}

          Recent changes:
          {diff_stat}

          Please analyze and provide specific, actionable recommendations. Format your response as markdown."""

          messages = [{"role": "user", "content": [{"text": prompt}]}]
          
          # Call Bedrock Kimi
          response = bedrock.converse(
              modelId='us.amazon.nova-lite-v1:0',
              messages=messages,
              inferenceConfig={
                  "maxTokens": 4096,
                  "temperature": 0.7
              }
          )
          
          output = response['output']['message']['content'][0]['text']
          print(output)
          
          # Save for next steps
          with open('agent_output.md', 'w') as f:
              f.write(f"## 🤖 AI Agent Analysis\n\n{output}\n\n---\n*Generated via AWS Bedrock*")
          EOF
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: agent-analysis
          path: agent_output.md
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('agent_output.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
