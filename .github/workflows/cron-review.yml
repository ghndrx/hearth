name: 🤖 AI Review Cycle

on:
  schedule:
    # Every 8 hours - review recently merged PRs
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (optional)'
        required: false
        default: ''
      mode:
        description: 'Review mode (review|analyze)'
        required: false
        default: 'review'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_REGION: us-west-2

jobs:
  find-recent-merges:
    name: 🔎 Find Recent Merges
    runs-on: ubuntu-latest
    outputs:
      pr_count: ${{ steps.find.outputs.count }}
      pr_list: ${{ steps.find.outputs.pr_list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find merged PRs
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d '48 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          
          prs=$(gh api graphql -f query='
            query {
              repository(owner: "ghndrx", name: "hearth") {
                pullRequests(
                  first: 5
                  states: MERGED
                  orderBy: {field: UPDATED_AT, direction: DESC}
                ) {
                  nodes {
                    number
                    title
                    mergedAt
                    files { totalCount }
                  }
                }
              }
            }
          ' --jq '.data.repository.pullRequests.nodes | jq -c . 2>/dev/null | head -5 || echo "")
          
          count=$(echo "$prs" | jq -s 'length' 2>/dev/null || echo "0")
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "pr_list<<EOF" >> $GITHUB_OUTPUT
          echo "$prs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Found $count recently merged PRs"

  review-backend:
    name: 🐹 Review Backend
    needs: find-recent-merges
    runs-on: ubuntu-latest
    if: needs.find-recent-merges.outputs.pr_count != '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Review backend code
        run: |
          pip install boto3 > /dev/null 2>&1
          
          python3 << 'EOF'
          import boto3
          import subprocess

          bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')

          try:
            commits = subprocess.check_output(
              ['git', 'log', '--oneline', '-10', 'origin/develop'],
              text=True
            )
          except:
            commits = "Unable to fetch"

          try:
            diff = subprocess.check_output(
              ['git', 'diff', 'HEAD~10', '--', 'backend/'],
              text=True
            )
          except:
            diff = "No backend changes"

          prompt = f"""Review Hearth (Discord alternative) backend Go code changes for:
1. Security issues (SQL injection, auth bypass, input validation)
2. Performance problems (N+1 queries, missing indexes)
3. Code quality (error handling, logging, Go idioms)
4. Best practices (concurrency, API design)

Be specific. Keep concise. Format as:
## ✅ What's Good
## ⚠️ Issues
## 💡 Suggestions
## 🚨 Security Alerts

Recent commits:
{commits[:1000]}

Backend diff (last 10 commits):
{diff[:6000]}
"""

          messages = [{"role": "user", "content": [{"text": prompt}]}]

          try:
            response = bedrock.converse(
              modelId='moonshotai.kimi-k2.5',
              messages=messages,
              inferenceConfig={"maxTokens": 2048, "temperature": 0.3}
            )
            output = response['output']['message']['content'][0]['text']
          except Exception as e:
            output = f"Review skipped: {e}"

          print(output)
          with open('backend_review.md', 'w') as f:
            f.write(f"## 🤖 Backend AI Review\n\n{output}\n\n---\n*Generated via Kimi K2.5*\n")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: backend-review
          path: backend_review.md

  review-frontend:
    name: 🎨 Review Frontend
    needs: find-recent-merges
    runs-on: ubuntu-latest
    if: needs.find-recent-merges.outputs.pr_count != '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Review frontend code
        run: |
          pip install boto3 > /dev/null 2>&1
          
          python3 << 'EOF'
          import boto3
          import subprocess

          bedrock = boto3.client('bedrock-runtime', region_name='us-west-2')

          try:
            diff = subprocess.check_output(
              ['git', 'diff', 'HEAD~10', '--', 'frontend/src/'],
              text=True
            )
          except:
            diff = "No frontend changes"

          prompt = f"""Review Hearth (Discord alternative) frontend Svelte/SvelteKit code for:
1. Accessibility (ARIA labels, keyboard nav, contrast)
2. Performance (bundle size, re-renders, lazy loading)
3. UX issues (loading states, error handling, mobile)
4. Code quality (TypeScript types, component structure)

Be specific. Format as:
## ✅ What's Good
## ⚠️ Issues
## 💡 Suggestions

Frontend diff (last 10 commits):
{diff[:6000]}
"""

          messages = [{"role": "user", "content": [{"text": prompt}]}]

          try:
            response = bedrock.converse(
              modelId='moonshotai.kimi-k2.5',
              messages=messages,
              inferenceConfig={"maxTokens": 2048, "temperature": 0.3}
            )
            output = response['output']['message']['content'][0]['text']
          except Exception as e:
            output = f"Review skipped: {e}"

          print(output)
          with open('frontend_review.md', 'w') as f:
            f.write(f"## 🤖 Frontend AI Review\n\n{output}\n\n---\n*Generated via Kimi K2.5*\n")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-review
          path: frontend_review.md

  report:
    name: 📊 Review Report
    needs: [find-recent-merges, review-backend, review-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate report
        run: |
          echo "# 🤖 AI Review Cycle Report"
          echo "**Run**: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo ""
          echo "## Recently Merged PRs: ${{ needs.find-recent-merges.outputs.pr_count }}"
          echo "${{ needs.find-recent-merges.outputs.pr_list }}"
          echo ""
          echo "## Backend Review"
          [ -f backend_review.md ] && cat backend_review.md || echo "Skipped"
          echo ""
          echo "## Frontend Review"
          [ -f frontend_review.md ] && cat frontend_review.md || echo "Skipped"
