name: 🚀 Ship Pipeline

on:
  # schedule DISABLED - no AI code generation from CI
    # Every 4 hours - main development cycle

  workflow_dispatch:
    inputs:
      priority:
        description: 'Focus area (p0_features|p1_features|security|tests)'
        required: false
        default: 'p0_features'
      force:
        description: 'Force run even if recently run (yes/no)'
        required: false
        default: 'no'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_REGION: us-west-2

jobs:
  # ============================================================
  # PHASE 1: Analyze what to build next
  # ============================================================
  analyze-roadmap:
    name: 📋 Analyze Roadmap
    runs-on: ubuntu-latest
    outputs:
      next-feature: ${{ steps.prioritize.outputs.next_feature }}
      feature-slug: ${{ steps.prioritize.outputs.feature_slug }}
      prd-path: ${{ steps.prioritize.outputs.prd_path }}
      scope: ${{ steps.prioritize.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan PRD directory
        id: scan
        run: |
          echo "=== Available PRDs ==="
          ls -lt PRDs/*.md 2>/dev/null | head -20 | awk '{print $NF}'
          echo "---"
          latest=$(ls -t PRDs/*.md | head -1)
          echo "latest_prd=$latest" >> $GITHUB_OUTPUT
          age=$(($(date +%s) - $(stat -c %Y "$latest" 2>/dev/null || echo $(date +%s))))
          echo "latest_age_seconds=$age" >> $GITHUB_OUTPUT

      - name: Check for existing feature branches
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branches=$(gh api repos/ghndrx/hearth/branches --jq '.[].name' 2>/dev/null | grep -E '^feature/|^fix/' || echo "none")
          echo "active_branches<<EOF" >> $GITHUB_OUTPUT
          echo "$branches" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prioritize next feature
        id: prioritize
        run: |
          # Pick the highest priority P0 not already in progress
          # Skip any feature that already has a branch
          
          active=$(gh api repos/ghndrx/hearth/branches --jq '.[].name' 2>/dev/null | grep '^feature/' | xargs -I{} basename {} . || true)
          
          # Find P0s in TASK_QUEUE
          feature=""
          slug=""
          
          while IFS= read -r line; do
            if echo "$line" | grep -q '^\- \[ \] \*\*\[P0\]\*\*'; then
              raw=$(echo "$line" | grep -oE 'Feature: [^—]+' | sed 's/Feature: //' | tr -d '**')
              s=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-')
              if ! echo "$active" | grep -q "$s"; then
                feature="$raw"
                slug="$s"
                break
              fi
            fi
          done < TASK_QUEUE.md
          
          # Fallback to P1
          if [ -z "$feature" ]; then
            while IFS= read -r line; do
              if echo "$line" | grep -q '^\- \[ \] \*\*\[P1\]\*\*'; then
                raw=$(echo "$line" | grep -oE 'Feature: [^—]+' | sed 's/Feature: //' | tr -d '**')
                s=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-')
                if ! echo "$active" | grep -q "$s"; then
                  feature="$raw"
                  slug="$s"
                  break
                fi
              fi
            done < TASK_QUEUE.md
          fi
          
          [ -z "$feature" ] && feature="none" && slug="none"
          
          prd=$(ls PRDs/*${slug}*.md 2>/dev/null | head -1 || echo "none")
          scope=$(grep -oE '[0-9]+-[0-9]+ weeks?' "PRDs/$prd" 2>/dev/null | head -1 || echo "unknown")
          
          echo "next_feature=$feature" >> $GITHUB_OUTPUT
          echo "feature_slug=$slug" >> $GITHUB_OUTPUT
          echo "prd_path=$prd" >> $GITHUB_OUTPUT
          echo "scope=$scope" >> $GITHUB_OUTPUT
          
          echo "=== Selected: $feature ==="

  # ============================================================
  # PHASE 2: Generate implementation plan from PRD
  # ============================================================
  plan-implementation:
    name: 📐 Plan Implementation
    needs: analyze-roadmap
    runs-on: ubuntu-latest
    if: needs.analyze-roadmap.outputs.next-feature != 'none'
    outputs:
      backend-files: ${{ steps.plan.outputs.backend_files }}
      frontend-files: ${{ steps.plan.outputs.frontend_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PRD
        id: prd
        run: |
          prd_path="${{ needs.analyze-roadmap.outputs.prd_path }}"
          if [ -f "$prd_path" ]; then
            echo "=== Reading PRD: $prd_path ==="
            head -50 "$prd_path"
          else
            echo "No PRD found - using feature name only"
          fi

      - name: Generate implementation plan
        id: plan
        run: |
          SLUG="${{ needs.analyze-roadmap.outputs.feature_slug }}"
          FEATURE="${{ needs.analyze-roadmap.outputs.next-feature }}"
          
          # Map feature slugs to file paths
          case "$SLUG" in
            forum-channels)
              backend_files="backend/internal/handlers/forum.go;backend/internal/models/forum.go"
              frontend_files="frontend/src/lib/stores/forum.ts;frontend/src/routes/(app)/forum/[id]/+page.svelte"
              ;;
            message-components)
              backend_files="backend/internal/handlers/components.go;backend/internal/models/message_component.go"
              frontend_files="frontend/src/lib/components/MessageButton.svelte;frontend/src/lib/stores/components.ts"
              ;;
            slash-commands)
              backend_files="backend/internal/handlers/commands.go;backend/internal/services/command.go"
              frontend_files="frontend/src/lib/stores/commands.ts"
              ;;
            server-folders)
              backend_files="backend/internal/handlers/server_folders.go;backend/internal/models/server_folder.go"
              frontend_files="frontend/src/lib/stores/serverFolders.ts"
              ;;
            unread-badges)
              backend_files="backend/internal/services/notification.go;backend/internal/database/migrations/$(date +%s)_unread.sql"
              frontend_files="frontend/src/lib/stores/unread.ts"
              ;;
            message-link-previews)
              backend_files="backend/internal/services/preview.go;backend/internal/handlers/preview.go"
              frontend_files="frontend/src/lib/stores/preview.ts;frontend/src/lib/components/LinkPreview.svelte"
              ;;
            global-custom-emojis)
              backend_files="backend/internal/handlers/emoji.go;backend/internal/models/emoji.go"
              frontend_files="frontend/src/lib/stores/emoji.ts;frontend/src/lib/components/EmojiPicker.svelte"
              ;;
            advanced-webhook-platform)
              backend_files="backend/internal/handlers/webhook.go;backend/internal/services/webhook.go"
              frontend_files="frontend/src/lib/stores/webhook.ts"
              ;;
            cross-server-friend-system)
              backend_files="backend/internal/handlers/friends.go;backend/internal/services/relationship.go"
              frontend_files="frontend/src/lib/stores/friends.ts"
              ;;
            *)
              backend_files="backend/internal/handlers/${SLUG}.go;backend/internal/models/${SLUG}.go"
              frontend_files="frontend/src/lib/stores/${SLUG}.ts"
              ;;
          esac
          
          echo "backend_files=$backend_files" >> $GITHUB_OUTPUT
          echo "frontend_files=$frontend_files" >> $GITHUB_OUTPUT
          
          echo "=== Files to create for: $FEATURE ==="
          echo "Backend: $backend_files"
          echo "Frontend: $frontend_files"

  # ============================================================
  # PHASE 3: Implement Backend (on develop directly)
  # ============================================================
  implement-backend:
    name: 🐹 Implement Backend
    needs: [analyze-roadmap, plan-implementation]
    runs-on: ubuntu-latest
    if: |
      needs.analyze-roadmap.outputs.next-feature != 'none' &&
      needs.plan-implementation.outputs.backend_files != ''
    outputs:
      branch: ${{ steps.branch.outputs.branch_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create feature branch
        id: branch
        run: |
          SLUG="${{ needs.analyze-roadmap.outputs.feature_slug }}"
          TIMESTAMP=$(date +%Y%m%d)
          BRANCH="feature/${TIMESTAMP}-${SLUG}"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
          echo "Created branch: $BRANCH"

      - name: Implement backend files
        env:
          FEATURE: ${{ needs.analyze-roadmap.outputs.next-feature }}
          SLUG: ${{ needs.analyze-roadmap.outputs.feature_slug }}
          BACKEND_FILES: ${{ needs.plan-implementation.outputs.backend_files }}
        run: |
          set -e
          
          echo "=== Implementing: $FEATURE ==="
          IFS=';' read -ra FILES <<< "$BACKEND_FILES"
          for file in "${FILES[@]}"; do
            dir=$(dirname "$file")
            mkdir -p "$dir"
            
            name=$(basename "$file" .go)
            if [[ "$file" == *.sql ]]; then
              cat > "$file" << SQLTEMPLATE
-- Migration: ${SLUG}
-- Created by: 🚀 Ship Pipeline
-- TODO: Add migration SQL

CREATE TABLE IF NOT EXISTS ${SLUG} (
    id TEXT PRIMARY KEY,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW()
);
SQLTEMPLATE
            else
              cat > "$file" << GOTEMPLATE
package $(basename $dir)

import "context"

// ${FEATURE}
// TODO: Implement ${name} handler
type ${name^} struct {}

func New${name^}() *${name^} {
    return &${name^}{}
}

func (h *${name^}) Handle(ctx context.Context) error {
    // TODO: Implement handler
    return nil
}
GOTEMPLATE
            fi
            echo "Created: $file"
          done
          
          git add -A
          git status --short

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "greg@gregh.dev"
          git config user.name "Greg Hendrickson"
          git commit -m "feat(${SLUG}): scaffold ${FEATURE}

Generated by 🚀 Ship Pipeline cron"
          git push -u origin ${{ steps.branch.outputs.branch_name }}

  # ============================================================
  # PHASE 4: Implement Frontend (on develop directly)
  # ============================================================
  implement-frontend:
    name: 🎨 Implement Frontend
    needs: [analyze-roadmap, plan-implementation]
    runs-on: ubuntu-latest
    if: |
      needs.analyze-roadmap.outputs.next-feature != 'none' &&
      needs.plan-implementation.outputs.frontend_files != ''
    outputs:
      branch: frontend-${{ steps.branch.outputs.branch_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create feature branch
        id: branch
        run: |
          SLUG="${{ needs.analyze-roadmap.outputs.feature_slug }}"
          TIMESTAMP=$(date +%Y%m%d)
          BRANCH="feature/${TIMESTAMP}-${SLUG}-frontend"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Implement frontend files
        env:
          FEATURE: ${{ needs.analyze-roadmap.outputs.next-feature }}
          SLUG: ${{ needs.analyze-roadmap.outputs.feature_slug }}
          FRONTEND_FILES: ${{ needs.plan-implementation.outputs.frontend_files }}
        run: |
          set -e
          
          echo "=== Implementing frontend: $FEATURE ==="
          IFS=';' read -ra FILES <<< "$FRONTEND_FILES"
          for file in "${FILES[@]}"; do
            dir=$(dirname "$file")
            mkdir -p "$dir"
            
            ext="${file##*.}"
            case "$ext" in
              svelte)
                cat > "$file" << SVELTETEMPLATE
<script lang="ts">
  /**
   * ${FEATURE}
   * TODO: Implement component
   */
  const slug = "${SLUG}";
</script>

<div class="{slug}">
  <p>${FEATURE} - TODO: Implement</p>
</div>

<style>
  .{slug} {
    /* TODO: Add styles */
  }
</style>
SVELTETEMPLATE
                ;;
              ts)
                cat > "$file" << TSTEMPLATE
/**
 * ${FEATURE}
 * TODO: Implement store/logic
 */

export const ${SLUG}Store = {
  // TODO: Implement
};
TSTEMPLATE
                ;;
            esac
            echo "Created: $file"
          done
          
          git add -A
          git status --short

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "greg@gregh.dev"
          git config user.name "Greg Hendrickson"
          git commit -m "feat(${SLUG}): frontend scaffold for ${FEATURE}"
          git push -u origin $BRANCH

  # ============================================================
  # PHASE 5: Open PR
  # ============================================================
  open-pr:
    name: 📝 Open PR
    needs: [analyze-roadmap, implement-backend, implement-frontend]
    runs-on: ubuntu-latest
    if: needs.analyze-roadmap.outputs.next-feature != 'none'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURE: ${{ needs.analyze-roadmap.outputs.next-feature }}
          SLUG: ${{ needs.analyze-roadmap.outputs.feature_slug }}
          SCOPE: ${{ needs.analyze-roadmap.outputs.scope }}
        run: |
          BRANCH="${{ needs.implement-backend.outputs.branch }}"
          
          # Check if PR exists
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' 2>/dev/null || echo "")
          
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $BRANCH"
            exit 0
          fi
          
          echo "=== Creating PR: $FEATURE ==="
          
          cat << PRBODY | gh pr create \
            --title "feat(${SLUG}): ${FEATURE}" \
            --body /dev/stdin \
            --base develop \
            --head "$BRANCH"
## 🚀 ${FEATURE}

Auto-generated implementation scaffold from Ship Pipeline.

**Priority**: P0/P1 competitive gap
**Estimated Scope**: ${SCOPE}

### ✅ What's Done
- Backend handler/service scaffold created
- Frontend component/store scaffold created
- Ready for implementation

### 📋 TODO
- [ ] Implement actual feature logic
- [ ] Add database migrations
- [ ] Write unit tests  
- [ ] Run manual code review
- [ ] Test integration end-to-end

---
*Generated by 🚀 Ship Pipeline*
PRBODY
          
          echo "✅ PR created"

  # ============================================================
  # REPORT
  # ============================================================
  report:
    name: 📊 Ship Report
    needs: [analyze-roadmap, open-pr]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate report
        run: |
          echo "# 🚀 Ship Pipeline Report"
          echo "**Run**: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| **Feature** | ${{ needs.analyze-roadmap.outputs.next-feature || 'Queue empty' }} |"
          echo "| **Slug** | ${{ needs.analyze-roadmap.outputs.feature_slug || 'N/A' }} |"
          echo "| **PRD** | ${{ needs.analyze-roadmap.outputs.prd_path || 'N/A' }} |"
          echo "| **Scope** | ${{ needs.analyze-roadmap.outputs.scope || 'N/A' }} |"
          echo "| **Branch** | ${{ needs.implement-backend.outputs.branch || 'skipped' }} |"
          echo ""
          
          result="💤 No work needed"
          if [ "${{ needs.analyze-roadmap.outputs.next-feature }}" != "none" ]; then
            result="✅ Feature scaffold PR created"
          fi
          echo "**Result**: $result"
