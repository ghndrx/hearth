name: Deploy to Production

# NOTE: Auto-deploy temporarily disabled (2026-02-16)
# Server SSH port 22 is not reachable from GitHub Actions runners.
# Server responds to gateway but GH Actions times out (likely IP filtering).
# Manual deployment via workflow_dispatch still available.
on:
  # push:
  #   branches:
  #     - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 15m
          script: |
            cd /opt/hearth
            git fetch origin develop
            git checkout develop
            git pull origin develop
            docker compose down
            docker rmi hearth-backend hearth-frontend 2>/dev/null || true
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
            echo "✅ Deployment complete at $(date)"

      - name: Health check
        run: |
          sleep 30
          curl -f https://hearth.gregh.dev/ || echo "⚠️ Health check failed but deployment may still be starting"
