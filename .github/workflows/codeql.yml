name: CodeQL Security Analysis

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly scan Monday 6am UTC

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          # Disable autofill of queries — use security-and-quality suite only
          queries: security-and-quality
          # Don't create GitHub Issues for alerts (Greg doesn't use Issues)
          upload: true
          trap: false

      - name: Build
        run: |
          cd backend
          go build ./...

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"
          upload: true
          # Upload results even if analysis fails partially
          exit-code: '0'
