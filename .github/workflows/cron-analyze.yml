name: 🔬 Competitive Analysis Pipeline

on:
  schedule:
    # Every 6 hours - refresh competitive intel
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force full refresh (yes/no)'
        required: false
        default: 'no'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  discord-watch:
    name: 📡 Discord Activity Watch
    runs-on: ubuntu-latest
    outputs:
      gaps_found: ${{ steps.scan.outputs.gaps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan competitive landscape
        id: scan
        run: |
          echo "=== Scanning competitive landscape ==="
          echo "Note: PRD-based analysis disabled - PRDs are informational only"
          echo "gaps=0" >> $GITHUB_OUTPUT

  github-issues-scan:
    name: 🔍 GitHub Issues Scan
    runs-on: ubuntu-latest
    outputs:
      open_issues: ${{ steps.scan.outputs.issue_count }}
      p0_issues: ${{ steps.scan.outputs.p0_count }}
      p1_issues: ${{ steps.scan.outputs.p1_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan GitHub issues
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh issue list --state open --limit 100 2>/dev/null | wc -l || echo "0")
          p0=$(gh issue list --state open --label "P0" --limit 50 2>/dev/null | wc -l || echo "0")
          p1=$(gh issue list --state open --label "P1" --limit 50 2>/dev/null | wc -l || echo "0")
          echo "open_issues=$open" >> $GITHUB_OUTPUT
          echo "p0_count=$p0" >> $GITHUB_OUTPUT
          echo "p1_count=$p1" >> $GITHUB_OUTPUT
          echo "Open issues: $open (P0: $p0, P1: $p1)"

  report:
    name: 📊 Analysis Report
    needs: [discord-watch, github-issues-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate report
        run: |
          echo "# 🔬 Competitive Analysis Report"
          echo "**Run**: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| P0 GitHub Issues | ${{ needs.github-issues-scan.outputs.p0_count }} |"
          echo "| P1 GitHub Issues | ${{ needs.github-issues-scan.outputs.p1_count }} |"
          echo "| Open Issues Total | ${{ needs.github-issues-scan.outputs.open_issues }} |"
          echo ""
          echo "## 📝 Note"
          echo "PRD files are informational only - not auto-generated or committed by this pipeline."
          echo "Feature prioritization is driven by GitHub Issues and labels."
