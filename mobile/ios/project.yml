name: Hearth
options:
  bundleIdPrefix: co.hndrx
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Hearth/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: co.hndrx.hearth
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    OTHER_LDFLAGS: "$(inherited)"

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - path: Hearth
        excludes:
          - "**/*.xcassets"
          - "**/*.xcodeproj"
          - "**/project.yml"
    resources:
      - path: Hearth/Resources/Assets.xcassets
      - path: Hearth/Resources/AccentColor.colorset
    settings:
      base:
        INFOPLIST_FILE: Hearth/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: co.hndrx.hearth
    dependencies: []
    entitlements:
      path: Hearth/Hearth.entitlements
      properties:
        aps-environment: development
        com.apple.developer.push-notifications: true

  HearthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearthTests
    dependencies:
      - target: Hearth
    settings:
      base:
        INFOPLIST_FILE: HearthTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: co.hndrx.hearth.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hearth.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hearth"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Hearth:
    build:
      targets:
        Hearth: all
        HearthTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HearthTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
